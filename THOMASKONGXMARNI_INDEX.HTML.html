                let p = acc === 'thomas' ? t_pools : acc === 'kong' ? k_pools : g_pools;
                
                const patterns = [
                    () => `${cap(pick(p.name))} is looking ${pick(pools.adj)} ${pick(pools.loc)}! That ${pick(p.trait)} is just ${pick(pools.adj)}. ${pick(pools.reaction)}`,
                    () => `Absolutely ${pick(pools.adj)}! Love seeing ${pick(p.name)} ${pick(pools.act_ing)} ${pick(pools.loc)}. The ${pick(p.trait)} is unmatched!`,
                    () => `The MARNI styling on ${pick(p.name)} is ${pick(pools.adj)}. Showcasing that ${pick(p.trait)} perfectly! ${pick(pools.reaction)}`,
                    () => `So proud to see ${pick(p.name)} ${pick(pools.loc)}. Pure ${pick(p.trait)} and ${pick(pools.noun)} radiating in every frame.`,
                    () => `${pick(pools.reaction)} ${cap(pick(p.name))} delivering ${pick(pools.adj)} ${pick(pools.noun)} like no other. Truly ${pick(pools.adj)}!`,
                    () => `I am completely obsessed with the ${pick(pools.adj)} ${pick(p.trait)} that ${pick(p.name)} is showing ${pick(pools.loc)}. ${pick(pools.reaction)}`,
                    () => `${pick(pools.intro_phrase)} ${cap(pick(p.name))} proves that ${pick(p.trait)} is everything. Such a ${pick(pools.adj)} moment!`,
                    () => `The way ${pick(p.name)} carries this look with such ${pick(p.trait)}! Absolutely ${pick(pools.adj)} ${pick(pools.loc)}. ${pick(pools.reaction)}`
                ];
                
                let text = pick(patterns)();
                if (isLong) {
                    text += ` ${pick(pools.bridge)} ${pick(long_tails)}`;
                } else {
                    const short_tails = ["So proud!", "Love this so much!", "Incredible as always.", "Absolutely stunning.", "Can't get enough of this.", "Simply the best.", "Always making us proud."];
                    text += ` ${pick(short_tails)}`;
                }
                return text;
            }
        };

        const recent = new Map();
        function generateInfiniteText(cat, acc) {
            const key = `${cat}:${acc}`;
            let seen = recent.get(key) || [];
            
            let text = "";
            if (cat === 'caption') text = generators.caption();
            else if (cat === 'shortCaption') text = generators.shortCaption();
            else if (cat === 'reelCaption') text = generators.reelCaption();
            else if (cat === 'storyCaption') text = generators.storyCaption();
            else if (cat === 'comment') text = generators.comment(acc, false);
            else if (cat === 'longComment') text = generators.comment(acc, true);

            // Avoid immediate repetition
            for (let i = 0; i < 25 && seen.includes(text); i++) {
                if (cat === 'caption') text = generators.caption();
                else if (cat === 'shortCaption') text = generators.shortCaption();
                else if (cat === 'reelCaption') text = generators.reelCaption();
                else if (cat === 'storyCaption') text = generators.storyCaption();
                else if (cat === 'comment') text = generators.comment(acc, false);
                else if (cat === 'longComment') text = generators.comment(acc, true);
            }
            
            seen.unshift(text);
            recent.set(key, seen.slice(0, 30));
            return text;
        }

        function setCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                b.className = "cat-btn py-3 px-4 rounded-2xl text-[11px] sm:text-xs font-semibold border border-stone-200 bg-white text-stone-700 shadow-sm transition-all active:scale-95";
            });
            const activeBtn = document.getElementById(`cat-${cat}`);
            if (activeBtn) {
                activeBtn.className = "cat-btn py-3 px-4 rounded-2xl text-[11px] sm:text-xs font-bold border border-brand bg-brand text-white shadow-sm transition-all active:scale-95";
            }

            const accContainer = document.getElementById('accountSelectorContainer');
            const tagContainer = document.getElementById('captionTagsContainer');
            const toggleContainer = document.getElementById('toggleContainer');

            if (cat === 'comment' || cat === 'longComment') {
                accContainer.classList.remove('hidden');
                tagContainer.classList.add('hidden');
                toggleContainer.classList.add('invisible');
                setAccount(currentAccount);
            } else {
                accContainer.classList.add('hidden');
                tagContainer.classList.remove('hidden');
                toggleContainer.classList.remove('invisible');
                generateContent();
            }

            const badgeMap = {
                caption: 'CAPTION', shortCaption: 'SHORT CAPTION',
                reelCaption: 'REEL CAPTION', storyCaption: 'STORY CAPTION',
                comment: 'COMMENT', longComment: 'LONG COMMENT'
            };
            document.getElementById('badgeCategory').innerText = badgeMap[cat] || 'CAPTION';
        }

        function setAccount(acc) {
            currentAccount = acc;
            document.querySelectorAll('.acc-btn').forEach(b => {
                b.className = "acc-btn py-2 text-[11px] font-bold rounded-xl border border-stone-200 bg-white text-stone-600 transition-all active:scale-95";
            });
            const activeAcc = document.getElementById(`acc-${acc}`);
            if (activeAcc) {
                activeAcc.className = "acc-btn py-2 text-[11px] font-bold rounded-xl border border-brand bg-rose-50 text-brand transition-all active:scale-95";
            }
            generateContent();
        }

        function toggleOutputMentions() {
            showOutputMentions = !showOutputMentions;
            const circle = document.getElementById('toggleCircle');
            const bg = document.getElementById('outputMentionsToggle');
            
            if (showOutputMentions) {
                if (bg) bg.className = "w-9 h-5 bg-brand rounded-full transition-colors relative flex items-center px-0.5 active:scale-95";
                if (circle) circle.style.transform = "translateX(16px)";
            } else {
                if (bg) bg.className = "w-9 h-5 bg-stone-300 rounded-full transition-colors relative flex items-center px-0.5 active:scale-95";
                if (circle) circle.style.transform = "translateX(0px)";
            }
            updateOutputHandlesDisplay();
        }

        function renderQCTags() {
            const grid = document.getElementById('qc-tags-grid');
            if (!grid) return;

            grid.innerHTML = qcAllTags.map(tag => {
                const isMention = tag.startsWith('@');
                const isVisible = isMention ? qcMentionsOn : true;
                const isSelected = qcSelectedTags.has(tag);

                if (!isVisible) {
                   return `<button class="py-2.5 px-2 rounded-full border border-stone-200 text-stone-400 font-bold text-[10px] sm:text-[11px] tracking-tight bg-stone-50 cursor-not-allowed opacity-50 grayscale transition-all whitespace-nowrap">${tag}</button>`;
                }

                const activeClass = "border-brand text-brand bg-white";
                const inactiveClass = "border-stone-200 text-stone-400 bg-white";
                const appliedClass = isSelected ? activeClass : inactiveClass;

                return `<button onclick="toggleQCTag('${tag}')" class="py-2.5 px-1 rounded-full border ${appliedClass} font-bold text-[10px] sm:text-[11px] tracking-tight shadow-sm active:scale-95 transition-all whitespace-nowrap overflow-hidden text-ellipsis">${tag}</button>`;
            }).join('');
            
            const btnCopy = document.getElementById('btn-qc-copy');
            if (btnCopy) {
                btnCopy.innerHTML = qcMentionsOn 
                    ? '<span class="text-sm">📋</span> COPY ALL ( HANDLES & HASHTAGS )' 
                    : '<span class="text-sm">📋</span> COPY ALL ( HASHTAGS ONLY )';
            }
        }
        
        function toggleQCMentions() {
            qcMentionsOn = !qcMentionsOn;
            const btn = document.getElementById('btn-qc-mentions');
            if (btn) {
                btn.innerText = qcMentionsOn ? 'MENTIONS: ON' : 'MENTIONS: OFF';
                btn.className = qcMentionsOn 
                    ? "px-3 py-1.5 rounded-full border border-brand bg-rose-50 text-[10px] font-bold text-brand tracking-wider shadow-sm active:scale-95 transition-all"
                    : "px-3 py-1.5 rounded-full border border-stone-200 bg-white text-[10px] font-bold text-stone-600 tracking-wider shadow-sm active:scale-95 transition-all";
            }
            renderQCTags();
        }
        
        function toggleQCTag(tag) {
            if (qcSelectedTags.has(tag)) {
                qcSelectedTags.delete(tag);
            } else {
                qcSelectedTags.add(tag);
            }
            renderQCTags();
        }
        
        function qcSelectAll() {
            qcAllTags.forEach(tag => {
                if (tag.startsWith('@') && !qcMentionsOn) return; 
                qcSelectedTags.add(tag);
            });
            renderQCTags();
        }
        
        function qcClear() {
            qcSelectedTags.clear();
            renderQCTags();
        }
        
        function copyQuickCopyTags() {
            const tagsToCopy = qcAllTags.filter(tag => {
                if (tag.startsWith('@') && !qcMentionsOn) return false;
                return qcSelectedTags.has(tag);
            });
            
            const mentions = tagsToCopy.filter(t => t.startsWith('@')).join(' ');
            
            let line1 = [];
            let line2 = [];
            tagsToCopy.filter(t => t.startsWith('#')).forEach(t => {
                if (['#MARNIXTHOMASKONG', '#MARNI', '#MFW'].includes(t)) {
                    line1.push(t);
                } else {
                    line2.push(t);
                }
            });
            
            const hashtagsText = [line1.join(' '), line2.join(' ')].filter(l => l.length > 0).join('\n');
            
            let text = "";
            if (mentions) text += mentions + "\n\n";
            if (hashtagsText) text += hashtagsText;
            
            if (!text.trim()) {
                showToast("No tags selected!");
                return;
            }
            copyToClipboardFallback(text.trim());
        }

        function toggleHashtag(tag) {
            if (selectedHashtags.has(tag)) selectedHashtags.delete(tag);
            else selectedHashtags.add(tag);
            updateOutputHandlesDisplay();
        }

        function updateOutputHandlesDisplay() {
            const container = document.getElementById('outputHandles');
            
            const handlesClass = showOutputMentions 
                ? "text-[13px] font-bold text-brand tracking-normal leading-relaxed text-center mb-4 transition-all duration-300"
                : "text-[13px] font-medium text-stone-400 tracking-normal leading-relaxed text-center mb-4 grayscale opacity-60 transition-all duration-300";

            if (!container) return;
            
            if (currentCategory === 'comment' || currentCategory === 'longComment') {
                container.innerHTML = '';
                return;
            }

            const handlesHTML = `
                <div class="${handlesClass}">
                    @marni @meryllrogge.personal<br>
                    @thomaschungmanirat @kongjiro<br>
                    @milanfashionweek
                </div>
            `;

            const getBtnClass = (tag) => selectedHashtags.has(tag) 
                ? "px-2.5 py-1 rounded-full border border-brand bg-rose-50 text-brand font-bold text-[10px] sm:text-[11px] tracking-tight shadow-sm active:scale-95 transition-all whitespace-nowrap cursor-pointer"
                : "px-2.5 py-1 rounded-full border border-stone-200 bg-stone-50 text-stone-400 font-medium text-[10px] sm:text-[11px] tracking-tight shadow-sm active:scale-95 transition-all grayscale opacity-60 whitespace-nowrap cursor-pointer";

            container.innerHTML = `
                ${handlesHTML}
                <div class="flex flex-col gap-1.5 items-center">
                    <div class="flex flex-wrap justify-center gap-1.5 w-full">
                        <button onclick="toggleHashtag('#MARNIXTHOMASKONG')" class="${getBtnClass('#MARNIXTHOMASKONG')}">#MARNIXTHOMASKONG</button>
                        <button onclick="toggleHashtag('#MARNI')" class="${getBtnClass('#MARNI')}">#MARNI</button>
                        <button onclick="toggleHashtag('#MFW')" class="${getBtnClass('#MFW')}">#MFW</button>
                    </div>
                    <div class="flex flex-wrap justify-center gap-1.5 w-full">
                        <button onclick="toggleHashtag('#tthomastc')" class="${getBtnClass('#tthomastc')}">#tthomastc</button>
                        <button onclick="toggleHashtag('#kongjiro')" class="${getBtnClass('#kongjiro')}">#kongjiro</button>
                    </div>
                </div>
            `;
        }

        function generateContent() {
            currentRawBody = generateInfiniteText(currentCategory, currentAccount);
            const textArea = document.getElementById('generatedText');
            if (currentCategory === 'storyCaption') {
                textArea.innerHTML = currentRawBody.replace(/\n/g, '<br>');
            } else {
                textArea.innerText = currentRawBody;
            }
            updateOutputHandlesDisplay();
        }

        function getFinalExportText() {
            let text = currentRawBody;
            
            if (currentCategory !== 'comment' && currentCategory !== 'longComment') {
                let additions = [];

                if (showOutputMentions) {
                    additions.push("@marni @meryllrogge.personal\n@thomaschungmanirat @kongjiro\n@milanfashionweek");
                }

                let line1 = ['#MARNIXTHOMASKONG', '#MARNI', '#MFW'].filter(t => selectedHashtags.has(t)).join(' ');
                let line2 = ['#tthomastc', '#kongjiro'].filter(t => selectedHashtags.has(t)).join(' ');
                let hashtagsText = [line1, line2].filter(l => l.length > 0).join('\n');

                if (hashtagsText) {
                    additions.push(hashtagsText);
                }

                if (additions.length > 0) {
                    text += "\n\n" + additions.join("\n\n");
                }
            }
            return text;
        }

        async function copyToClipboardFallback(text) {
            try {
                if (navigator.clipboard && window.isSecureContext) {
                    await navigator.clipboard.writeText(text);
                } else {
                    const textArea = document.createElement("textarea");
                    textArea.value = text;
                    textArea.style.position = "absolute";
                    textArea.style.left = "-999999px";
                    document.body.prepend(textArea);
                    textArea.select();
                    document.execCommand("copy");
                    textArea.remove();
                }
                showToast("Copied to clipboard!");
            } catch (err) {
                console.error("Clipboard write failed: ", err);
                showToast("Copied to clipboard!");
            }
        }

        function copyGeneratedText() {
            const text = getFinalExportText();
            copyToClipboardFallback(text);
        }

        function saveCurrentCopy() {
            const text = getFinalExportText();
            if (savedCopies.includes(text)) return showToast("Already saved!");
            savedCopies.unshift(text);
            setSavedCopies(savedCopies);
            renderSaved();
            showToast("Saved to list!");
        }

        function renderSaved() {
            const list = document.getElementById('savedList');
            const countElem = document.getElementById('savedCount');
            if (!list || !countElem) return;

            countElem.innerText = savedCopies.length;
            if (savedCopies.length === 0) {
                list.innerHTML = `<p class="text-center text-xs text-stone-400 py-4">No saved copies yet.</p>`;
                return;
            }
            list.innerHTML = savedCopies.map((item, idx) => `
                <div class="p-3 bg-stone-50 rounded-2xl border border-stone-200 text-xs flex flex-col gap-2">
                    <p class="text-stone-700 whitespace-pre-wrap font-medium line-clamp-custom leading-relaxed">${item}</p>
                    <button onclick="copySavedIndex(${idx})" class="text-brand self-end font-bold hover:underline shrink-0 text-[11px] bg-rose-50 px-3 py-1.5 rounded-full border border-brand/20 active:scale-95 transition-transform">COPY TEXT</button>
                </div>
            `).join('');
        }

        function copySavedIndex(idx) {
            copyToClipboardFallback(savedCopies[idx]);
        }

        function clearAllSaved() {
            savedCopies = [];
            setSavedCopies(savedCopies);
            renderSaved();
            showToast("Cleared all saved items!");
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            if (!toast) return;
            if (toastTimeout) clearTimeout(toastTimeout);
            toast.innerText = msg;
            toast.style.opacity = '1';
            toast.style.transform = 'translate(-50%, 0)';
            toastTimeout = setTimeout(() => { 
                toast.style.opacity = '0'; 
                toast.style.transform = 'translate(-50%, 16px)';
            }, 2500);
        }

        document.addEventListener('DOMContentLoaded', () => {
            setCategory('caption');
            renderSaved();
            renderQCTags();
        });
    </script>
</body>
</html>
